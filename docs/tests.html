<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diskette Toolkit Tests</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1d1d1b; --dim:#6b6a66; --line:#e3e1dc;
  --accent:#2f6fdb; --ok:#1f8a4c; --bad:#c43d32; --warn:#b7791f; --chip:#eef2fb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --card:#1f2125; --text:#ecebe8; --dim:#9a9993; --line:#2e3036;
    --accent:#6fa0ff; --ok:#4cc27d; --bad:#ff7b6e; --warn:#e3b55a; --chip:#23293a;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --card:#1f2125; --text:#ecebe8; --dim:#9a9993; --line:#2e3036;
  --accent:#6fa0ff; --ok:#4cc27d; --bad:#ff7b6e; --warn:#e3b55a; --chip:#23293a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 14px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lang button{min-width:44px}
.lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.saved{background:var(--chip);border-radius:8px;padding:8px 12px;margin:0 0 14px;font-size:14px;display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 16px}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--dim);gap:3px}
input[type=text],textarea{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:100%}
.hw{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.hw label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:140px;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.count{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{padding:8px 14px}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin:0 0 14px}
.legend b{display:inline-block;width:22px;text-align:center;border-radius:5px;margin-right:4px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;overflow:hidden}
section>header{padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px solid var(--line)}
section h3{font-size:17px;margin:0}
section .need{color:var(--dim);font-size:13px}
section .sc{color:var(--dim);font-size:13px;white-space:nowrap}
.item{padding:12px 16px;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:none}
.t{font-weight:600}
.how{margin:3px 0 0}
.exp{margin:4px 0 0;font-size:14px;color:var(--dim)}
.exp b{color:var(--text)}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.row{display:grid;grid-template-columns:120px auto 1fr;gap:8px;align-items:start}
.row .hwname{font-size:13px;color:var(--dim);padding-top:5px}
.st{display:flex;gap:4px}
.st button{width:32px;height:30px;padding:0;font-weight:600}
.st button.on[data-v="ok"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.st button.on[data-v="bad"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.st button.on[data-v="skip"]{background:var(--dim);color:#fff;border-color:var(--dim)}
.row textarea{min-height:32px;height:32px;resize:vertical}
.row.bad textarea{border-color:var(--bad)}
kbd{font:inherit;font-size:13px;background:var(--chip);border-radius:4px;padding:0 5px}
.pri{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;background:var(--chip);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
#log{min-height:140px;font-family:Consolas,monospace;font-size:13px}
@media (max-width:600px){ .row{grid-template-columns:1fr} section>header{flex-direction:column;gap:2px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="h1"></h1>
      <p class="sub" id="intro"></p>
    </div>
    <div class="lang"><button data-l="cs">CZ</button> <button data-l="en">EN</button></div>
  </div>
  <div class="saved" id="savedNote"></div>

  <div class="card">
    <h2 id="infoH"></h2>
    <div class="grid" id="info"></div>
    <div class="hw" id="hw"></div>
  </div>

  <div class="bar">
    <div class="prog"><i id="pbar"></i></div>
    <span class="count" id="pcount"></span>
    <button class="primary" id="saveHtml"></button>
    <button id="saveTxt"></button>
    <button id="copy"></button>
    <button id="reset"></button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="legend" id="legend"></div>
  <div id="list"></div>

  <div class="card">
    <h2 id="logH"></h2>
    <p class="sub" id="logHelp" style="margin:0 0 8px"></p>
    <textarea id="log"></textarea>
  </div>
</div>
<div class="toast" id="toast"></div>

<script id="saved" type="application/json">null</script>
<script>

// [id, important, hardware (one status row each), CZ title, CZ how, CZ expected, EN title, EN how, EN expected]
const NEW = [
 {id:"d1", cs:"Otevření diagnostiky", en:"Opening the diagnostics", needCs:"interní mechanika s fdrawcmd.sys a/nebo Greaseweazle", needEn:"internal drive with fdrawcmd.sys and/or Greaseweazle", items:[
  ["btn",1,["fd","gw","usb"],"Tlačítko „Diagnostika mechaniky…“","Vyber mechaniku v horní liště a podívej se do pravého sloupce pod <kbd>Spouštěcí disketa…</kbd>.","Interní mechanika s fdrawcmd.sys a Greaseweazle: tlačítko je vidět. USB disketovka: tlačítko není vidět.",
   "“Drive diagnostics…” button","Select the drive in the top bar and look in the right column below <kbd>Boot disk…</kbd>.","Internal drive with fdrawcmd.sys and Greaseweazle: the button is visible. USB drive: no button."],
  ["dlg",0,["fd","gw"],"Okno diagnostiky","Klikni na <kbd>Diagnostika mechaniky…</kbd>, proklikej volby.","U každé volby se dole změní vysvětlení. U Greaseweazle je „Výpis rozložení všech stop“ šedý. Texty nejsou oříznuté.",
   "Diagnostics window","Click <kbd>Drive diagnostics…</kbd> and click through the options.","The explanation below changes for each option. With a Greaseweazle “Layout listing of all tracks” is grey. No text is cut off."],
  ["demo",0,null,"Ukázkový režim","Spusť <kbd>DisketteToolkit.exe --demo</kbd>, vyber mechaniku B: a vyzkoušej diagnostiku.","Simulované otáčky kolem 300,6, čidla OK, stopa 22 občas chybuje, stopa 79 „nestandardní“.",
   "Demo mode","Run <kbd>DisketteToolkit.exe --demo</kbd>, select drive B: and try the diagnostics.","Simulated speed around 300.6, sensors OK, track 22 sometimes fails, track 79 “non-standard”."]]},
 {id:"d2", cs:"Otáčky", en:"Speed (rpm)", needCs:"libovolná naformátovaná disketa (ne cenný originál)", needEn:"any formatted disk (not a precious original)", items:[
  ["rpm",1,["fd","gw"],"Změřit otáčky (10 otáček)","Vlož disketu → Diagnostika → <kbd>Změřit otáčky</kbd> → Spustit.","Ve výpisu: otáčky (kolem 300), rozsah, kolísání a hodnocení. <b>Do poznámky napiš naměřené číslo.</b>",
   "Measure speed (10 revolutions)","Insert a disk → Diagnostics → <kbd>Measure speed</kbd> → Run.","The log shows the speed (about 300), range, wobble and a verdict. <b>Write the measured number into the note.</b>"],
  ["live",1,["fd","gw"],"Živé měření otáček","Diagnostika → <kbd>Živé měření otáček</kbd> → Spustit. Nech běžet aspoň 30 s, pak <kbd>Zastavit měření</kbd>.","Okénko s velkým číslem, obnovuje se zhruba každou otáčku; barva zelená / oranžová / červená podle hodnocení. Po zastavení okénko zmizí a ve výpisu je souhrn.",
   "Live speed measurement","Diagnostics → <kbd>Live speed measurement</kbd> → Run. Let it run for at least 30 s, then <kbd>Stop measuring</kbd>.","A window with a large number that updates about every revolution; colour green / orange / red by verdict. After stopping, the window closes and the log shows a summary."],
  ["trim",0,["fd","gw"],"Seřízení trimrem (jen kdo si troufne)","Při živém měření opatrně otoč trimrem rychlosti na desce mechaniky (u mechanik, které ho mají).","Číslo reaguje do pár sekund. Napiš, z jaké na jakou hodnotu ses dostal.",
   "Adjusting with the trimmer (only if you dare)","During live measurement carefully turn the speed trimmer on the drive board (drives that have one).","The number reacts within a few seconds. Write from which value to which you got."],
  ["cmp",0,["fd","gw"],"Porovnání s jiným nástrojem","Pokud můžeš: změř otáčky i jinak (<kbd>gw rpm</kbd>, SAMdisk <kbd>rpm</kbd>, stroboskop).","Hodnoty se liší nejvýš o pár desetin. Napiš obě čísla.",
   "Comparison with another tool","If you can, measure the speed another way too (<kbd>gw rpm</kbd>, SAMdisk <kbd>rpm</kbd>, strobe disk).","Values differ by a few tenths at most. Write both numbers."],
  ["nodisk",0,["fd","gw"],"Měření bez diskety","Vyndej disketu a spusť Změřit otáčky.","Srozumitelná hláška (vlož disketu / index), žádný pád ani zaseknutí.",
   "Measuring without a disk","Remove the disk and run Measure speed.","A clear message (insert a disk / index), no crash or hang."]]},
 {id:"d3", cs:"Čidla a hlava", en:"Sensors and head", needCs:"disketa s posuvným okénkem ochrany proti zápisu", needEn:"a disk with a write-protect slider", items:[
  ["t0",1,["fd","gw"],"Čidlo stopy 0","Diagnostika → <kbd>Kontrola čidel</kbd> → Spustit.","Oba řádky „Čidlo stopy 0“ zeleně (na stopě 0 hlásí, na stopě 10 nehlásí).",
   "Track 0 sensor","Diagnostics → <kbd>Sensor check</kbd> → Run.","Both “Track 0 sensor” lines green (reports on track 0, does not on track 10)."],
  ["wp",1,["fd","gw"],"Ochrana proti zápisu","Kontrolu čidel spusť dvakrát: s otevřeným a se zavřeným okénkem ochrany.","Řádek „Ochrana proti zápisu“ se změní (ZAPNUTÁ / vypnutá) a odpovídá okénku.",
   "Write protection","Run the sensor check twice: with the write-protect window open and closed.","The “Write protection” line changes (ON / off) and matches the window."],
  ["disk",0,["fd","gw"],"Vložená disketa","Kontrolu čidel spusť s disketou a bez ní.","„Vložená disketa: ano / ne“ odpovídá skutečnosti. (U Greaseweazle je to orientační — napiš, co ukázal.)",
   "Disk inserted","Run the sensor check with and without a disk.","“Disk inserted: yes / no” matches reality. (With Greaseweazle it is only a guide — write what it showed.)"],
  ["idx",0,["fd","gw"],"Index čidlo","Kontrola čidel s vloženou disketou.","„Index čidlo: dává pulsy — v pořádku“.",
   "Index sensor","Sensor check with a disk inserted.","“Index sensor: gives pulses — OK”."],
  ["head",0,["fd","gw"],"Hlava na stopu 0 / na poslední stopu","Spusť <kbd>Hlava na poslední stopu</kbd>, pak <kbd>Hlava na stopu 0</kbd> (jde slyšet, s odkrytou mechanikou i vidět).","Hlava dojede na konec a zpět, ve výpisu potvrzení, bez chyb.",
   "Head to track 0 / last track","Run <kbd>Head to the last track</kbd>, then <kbd>Head to track 0</kbd> (you can hear it; see it with the cover off).","The head moves to the end and back, the log confirms it, no errors."],
  ["sweep",0,["fd","gw"],"Projet dráhu 10×","Spusť <kbd>Projet hlavou celou dráhu 10×</kbd>; jednou zkus v půlce <kbd>Přerušit</kbd>.","Hlava jezdí tam a zpět, průběh dole ukazuje 1–10/10. Přerušit zastaví do pár sekund.",

  ["clean",0,["fd","gw"],"Čištění čisticí disketou","Jen s čisticí disketou: <kbd>Vyčistit hlavu čisticí disketou</kbd>, 3 průchody.","Disketa se točí, hlava jezdí cik-cak, průběh 1–3/3. V okně diagnostiky je potom „Naposledy čištěno: dnešní datum“.",
   "Cleaning with a cleaning disk","Only with a cleaning disk: <kbd>Clean the head with a cleaning disk</kbd>, 3 passes.","The disk spins, the head zig-zags, progress 1–3/3. The diagnostics window then shows “Last cleaned: today's date”."]]},
 {id:"d4", cs:"Čtení stopy a rozložení stop", en:"Track read and track layout", needCs:"dobrá disketa, disketa s vadným místem, případně originální (chráněná) hra", needEn:"a good disk, a disk with a bad spot, ideally an original (protected) game", items:[
  ["trgood",1,["fd","gw"],"Opakované čtení — dobrá disketa","<kbd>Opakované čtení jedné stopy</kbd>, stopa 0, strana 0, 20×.","Ve výpisu 20 řádků 9/9 (nebo podle formátu), na konci „Stopa se čte spolehlivě.“",
   "Repeated read — good disk","<kbd>Repeated read of one track</kbd>, track 0, side 0, 20×.","20 lines with 9/9 (or as the format has) and “The track reads reliably.”"],
  ["trbad",1,["fd","gw"],"Opakované čtení — vadná stopa","Najdi vadnou stopu testem povrchu, pak ji čti 20×.","Ukáže, kolikrát se přečetla celá, které sektory chyběly a hodnocení (poškozená disketa / špinavá hlava). <b>Napiš, co hodnocení řeklo a jestli sedí.</b>",
   "Repeated read — bad track","Find a bad track with the surface test, then read it 20×.","Shows how often it read completely, which sectors failed and a verdict (damaged disk / dirty head). <b>Write what the verdict said and whether it fits.</b>"],
  ["laystd",1,["fd"],"Rozložení stop — běžná disketa","<kbd>Výpis rozložení všech stop</kbd> na běžné disketě (Atari 720 KB nebo PC).","Řádek pro každou stopu a stranu (např. „0.0: 9 × 512 B, pořadí 1 2 3…“), na konci „Všechny stopy mají běžné rozložení.“",
   "Track layout — normal disk","<kbd>Layout listing of all tracks</kbd> on a normal disk (Atari 720 KB or PC).","A line per track and side (e.g. “0.0: 9 × 512 B, order 1 2 3…”), ending with “All tracks have a normal layout.”"],
  ["layodd",0,["fd"],"Rozložení stop — zvláštní disketa","Totéž s Atari disketou 10/11 sektorů, s prokládaným formátem, nebo s originální hrou.","Pořadí sektorů odpovídá formátu; u ochrany oranžové řádky s odchylkami a rada zálohovat jako tok. <b>Napiš název hry.</b>",
   "Track layout — unusual disk","The same with an Atari 10/11-sector disk, an interleaved format, or an original game.","The sector order matches the format; protection shows orange lines with anomalies and advice to back up as flux. <b>Write the game title.</b>"],
  ["note",0,["fd","gw"],"Záznam o mechanice","Do „Poznámka“ v okně diagnostiky napiš model mechaniky, spusť cokoli, zavři a znovu otevři program.","Poznámka, naposledy změřené otáčky a čištění v okně zůstanou.",
   "Drive record","Type the drive model into “Note” in the diagnostics window, run anything, close and reopen the program.","The note, last measured speed and cleaning date stay in the window."]]},
 {id:"d5", cs:"Druhý testovací build — mechanika", en:"Second test build — drive", needCs:"naformátovaná disketa, kterou nepotřebuješ", needEn:"a formatted disk you don't need", items:[
  ["warm",1,["fd","gw"],"Test zahřátí","Diagnostika → <kbd>Test zahřátí</kbd>, 10 minut → Spustit. Nech doběhnout.","Každou půlminutu řádek s otáčkami, okénko s číslem; na konci začátek, konec, změna a hodnocení. <b>Napiš změnu (např. −0,4).</b>",
   "Warm-up test","Diagnostics → <kbd>Warm-up test</kbd>, 10 minutes → Run. Let it finish.","A speed line every half minute and the speed window; at the end start, end, change and a verdict. <b>Write the change (e.g. −0.4).</b>"],
  ["step",1,["fd","gw"],"Test přesnosti krokování","Diagnostika → <kbd>Test přesnosti krokování</kbd> → Spustit.","6 řádků (stopy 10, 40, 70 zvenku a zevnitř). Na zdravé mechanice „Krokování je přesné z obou směrů“. U Greaseweazle napiš, jestli výsledek dává smysl.",
   "Step accuracy test","Diagnostics → <kbd>Step accuracy test</kbd> → Run.","6 lines (tracks 10, 40, 70 from outside and inside). A healthy drive gives “Stepping is accurate from both directions”. With a Greaseweazle, write whether the result makes sense."],

const KEY = "dtk-tests-" + VERSION;
let state = { lang:null, tab:"new", info:{}, hw:{}, items:{}, log:"" };
const embedded = (() => { try { return JSON.parse(document.getElementById("saved").textContent); } catch(e) { return null; } })();
if (embedded) state = Object.assign(state, embedded);
else { try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {} }
if (!state.lang) state.lang = (navigator.language || "").toLowerCase().startsWith("cs") || (navigator.language || "").toLowerCase().startsWith("sk") ? "cs" : "en";

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
const $ = id => document.getElementById(id);
const u = () => UI[state.lang];
const F = (s, ...a) => s.replace(/\{(\d)\}/g, (_, i) => a[i]);

function selectedHw() { const s = ["usb","fd","gw"].filter(h => state.hw[h]); return s.length ? s : ["usb","fd","gw"]; }
function sectionVisible(sec) { return !sec.hw || selectedHw().includes(sec.hw); }
function rowsOf(item) { const hw = item[2]; if (!hw) return [null]; const r = hw.filter(h => selectedHw().includes(h)); return r.length ? r : []; }
function text(item) { return state.lang === "cs" ? item.slice(3, 6) : item.slice(6, 9); }
function blocks() { return [["new", NEW], ["all", ALL]]; }

function renderStatic() {
  document.documentElement.lang = state.lang;
  const t = u();
  for (const k of ["h1","infoH","saveHtml","saveTxt","copy","reset","logH","logHelp"]) $(k).textContent = t[k];
  $("intro").innerHTML = t.intro;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === state.lang));
  $("info").innerHTML = "";
  for (const f of ["name","contact","windows","drive","controller","gw"]) {
    const l = document.createElement("label"); l.className = "f"; l.textContent = t[f];
    const i = document.createElement("input"); i.type = "text"; i.value = state.info[f] || "";
    i.oninput = () => { state.info[f] = i.value; save(); };
    l.appendChild(i); $("info").appendChild(l);
  }
  $("hw").innerHTML = `<span>${t.hwQ}</span>`;
  for (const [h, name] of [["usb", t.usb], ["fd", t.fd], ["gw", t.gwhw]]) {
    const l = document.createElement("label");
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = !!state.hw[h];
    c.onchange = () => { state.hw[h] = c.checked; save(); render(); };
    l.appendChild(c); l.appendChild(document.createTextNode(name)); $("hw").appendChild(l);
  }
  $("tabs").innerHTML = "";
  for (const [id, label] of [["new", t.tabNew], ["all", t.tabAll]]) {
    const b = document.createElement("button"); b.textContent = label; b.classList.toggle("on", state.tab === id);
    b.onclick = () => { state.tab = id; save(); renderStatic(); render(); };
    $("tabs").appendChild(b);
  }
  $("legend").innerHTML = `<span><b style="background:var(--ok);color:#fff">✓</b>${t.lgOk}</span><span><b style="background:var(--bad);color:#fff">✗</b>${t.lgBad}</span><span><b style="background:var(--dim);color:#fff">–</b>${t.lgSkip}</span><span><span class="pri">${t.pri}</span> ${t.lgPri}</span>`;
  $("log").value = state.log || "";
  if (embedded && embedded.savedAt) {
    $("savedNote").style.display = "block";
    $("savedNote").textContent = F(t.savedNote, (embedded.info && embedded.info.name) || "?", embedded.savedAt);
  }
}

function render() {
  const t = u(), list = $("list");
  list.innerHTML = "";
  const data = state.tab === "new" ? NEW : ALL;
  for (const sec of data) {
    if (!sectionVisible(sec)) continue;
    const el = document.createElement("section");
    const need = state.lang === "cs" ? sec.needCs : sec.needEn;
    el.innerHTML = `<header><div><h3>${state.lang === "cs" ? sec.cs : sec.en}</h3>${need ? `<div class="need">${t.need} ${need}</div>` : ""}</div><span class="sc" data-sec="${sec.id}"></span></header>`;
    for (const item of sec.items) {
      const rows = rowsOf(item);
      if (!rows.length) continue;
      const [title, how, exp] = text(item);
      const it = document.createElement("div"); it.className = "item";
      it.innerHTML = `<div class="t">${title}${item[1] ? `<span class="pri">${t.pri}</span>` : ""}</div><p class="how">${how}</p><p class="exp"><b>${t.exp}</b> ${exp}</p><div class="rows"></div>`;
      for (const hw of rows) {
        const k = sec.id + "." + item[0] + (hw ? "@" + hw : "");
        const st = state.items[k] || {};
        const row = document.createElement("div"); row.className = "row" + (st.v ? " " + st.v : "");
        row.innerHTML = `<span class="hwname">${hw ? t.hwNames[hw] : ""}</span><div class="st"><button data-v="ok">✓</button><button data-v="bad">✗</button><button data-v="skip">–</button></div><textarea placeholder="${t.note}"></textarea>`;
        row.querySelectorAll(".st button").forEach(b => {
          b.classList.toggle("on", st.v === b.dataset.v);
          b.onclick = () => {
            const cur = state.items[k] || {};
            cur.v = cur.v === b.dataset.v ? undefined : b.dataset.v;
            state.items[k] = cur; save();
            row.className = "row" + (cur.v ? " " + cur.v : "");
            row.querySelectorAll(".st button").forEach(x => x.classList.toggle("on", x.dataset.v === cur.v));
            if (cur.v === "bad") row.querySelector("textarea").focus();
            stats();
          };
        });
        const ta = row.querySelector("textarea"); ta.value = st.n || "";
        ta.oninput = () => { const cur = state.items[k] || {}; cur.n = ta.value; state.items[k] = cur; save(); };
        it.querySelector(".rows").appendChild(row);
      }
      el.appendChild(it);
    }
    list.appendChild(el);
  }
  stats();
}

function keysOf(data) {
  const out = [];
  for (const sec of data) { if (!sectionVisible(sec)) continue;
    for (const item of sec.items) for (const hw of rowsOf(item)) out.push([sec, item, hw, sec.id + "." + item[0] + (hw ? "@" + hw : "")]); }
  return out;
}

function stats() {
  const t = u();
  const keys = keysOf(state.tab === "new" ? NEW : ALL);
  let done = 0;
  const per = {};
  for (const [sec, , , k] of keys) {
    const v = (state.items[k] || {}).v;
    per[sec.id] = per[sec.id] || [0, 0, 0];
    per[sec.id][0]++; if (v) { per[sec.id][1]++; done++; } if (v === "bad") per[sec.id][2]++;
  }
  document.querySelectorAll(".sc").forEach(s => { const p = per[s.dataset.sec] || [0,0,0]; s.textContent = `${p[1]} / ${p[0]}` + (p[2] ? ` · ${p[2]}× ${t.errors}` : ""); });
  $("pcount").textContent = `${done} / ${keys.length}`;
  $("pbar").style.width = (keys.length ? 100 * done / keys.length : 0) + "%";
}

function report() {
  const t = u();
  let out = `Diskette Toolkit ${VERSION} — ${state.lang === "cs" ? "výsledky testů" : "test results"}\n`;
  for (const f of ["name","contact","windows","drive","controller","gw"]) if (state.info[f]) out += `${t[f]}: ${state.info[f]}\n`;
  out += `${t.hwQ} ${selectedHw().map(h => t.hwNames[h]).join(", ")}\n`;
  for (const [id, data] of blocks()) {
    out += `\n##### ${id === "new" ? t.tabNew : t.tabAll} #####\n`;
    let sec0 = null;
    for (const [sec, item, hw, k] of keysOf(data)) {
      if (sec !== sec0) { out += `\n== ${state.lang === "cs" ? sec.cs : sec.en} ==\n`; sec0 = sec; }
      const st = state.items[k] || {};
      out += `[${st.v ? t.L[st.v] : t.untested}] ${text(item)[0]}${hw ? " (" + t.hwNames[hw] + ")" : ""}` + (st.n ? `\n    → ${st.n.replace(/\n/g, "\n      ")}` : "") + "\n";
    }
  }
  if (state.log) out += `\n##### ${t.logH} #####\n${state.log}\n`;
  return out;
}

function download(name, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(u().savedOk);
}
function fileBase() {
  const n = (state.info.name || "tester").replace(/[^\p{L}\p{N}_-]+/gu, "_").slice(0, 30);
  const d = new Date(), p = x => String(x).padStart(2, "0");
  return `DTK-${VERSION}-${state.lang === "cs" ? "testy" : "tests"}-${n}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
}

function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }

$("saveHtml").onclick = () => {
  const d = new Date();
  const snap = Object.assign({}, state, { savedAt: d.toLocaleString() });
  const json = JSON.stringify(snap).replace(/</g, "\\u003c");
  const html = SRC.replace(/(<script id="saved" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b);
  download(fileBase() + ".html", html, "text/html");
};
$("saveTxt").onclick = () => download(fileBase() + ".txt", report(), "text/plain");
$("copy").onclick = () => {
  const out = report();
  const done = () => toast(u().copied);
  const fallback = () => { const a = document.createElement("textarea"); a.value = out; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); done(); } catch(e) {} a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(done, fallback); else fallback();
};
$("reset").onclick = () => { if (confirm(u().resetQ)) { state = { lang: state.lang, tab: state.tab, info:{}, hw:{}, items:{}, log:"" }; save(); renderStatic(); render(); } };
$("log").oninput = () => { state.log = $("log").value; save(); };
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { state.lang = b.dataset.l; save(); renderStatic(); render(); });

renderStatic();
render();
</script>
</body>
</html>
